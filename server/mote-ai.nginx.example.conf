# Include this inside the existing mote.ylxdzsw.com server block.
# The global nginx config already defines map $cookie_nginx_auth $nginx_auth_ok.

location = /ai-login {
    if ($nginx_auth_ok = 1) { return 302 /; }
    root /var/www;
    try_files /login.html =404;
}

location = /api/ai {
    default_type application/json;
    client_max_body_size 64m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 15m;
    if ($nginx_auth_ok = 0) { return 401 '{"error":"unauthorized"}'; }
    proxy_pass http://moted_ai;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Cache-Control no-store always;
}

location ^~ /api/ai/ {
    default_type application/json;
    client_max_body_size 64m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 15m;
    if ($nginx_auth_ok = 0) { return 401 '{"error":"unauthorized"}'; }
    proxy_pass http://moted_ai;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Cache-Control no-store always;
}

