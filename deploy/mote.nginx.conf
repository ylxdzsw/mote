server {
    listen 443 ssl;
    http2 on;
    server_name mote.ylxdzsw.com;

    ssl_certificate /etc/nginx/ssl/ylxdzsw.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ylxdzsw.com.key;
    root /var/www/mote;
    index index.html;
    etag off;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Use the same login page and reload-in-place gate as the other protected apps.
    error_page 403 =200 /login.html;
    location = /login.html {
        internal;
        root /var/www;
    }
    location = /login { return 302 /; }
    location = /ai-login { return 302 /; }

    # Public code has no document data. Both private and shared readers need it.
    location ^~ /assets/ { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location ^~ /s/ { try_files /index.html =404; }

    client_max_body_size 128m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 15m;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Content-Type-Options;

    # The service only accepts GET and exactly one high-entropy share token here.
    location ^~ /api/shared/ {
        proxy_pass http://unix:/run/moted/moted.sock;
    }
    # Reservation-scoped bearer capabilities; never log their secret URLs.
    location ^~ /api/agent/ {
        access_log off;
        proxy_pass http://unix:/run/moted/moted.sock;
    }
    location ^~ /api/ {
        default_type application/json;
        if ($nginx_auth_ok = 0) { return 401 '{"error":"unauthorized"}'; }
        proxy_pass http://unix:/run/moted/moted.sock;
        proxy_buffering off;
    }
    location ~ /\. { return 404; }
    location / {
        if ($nginx_auth_ok = 0) { return 403; }
        try_files $uri /index.html;
    }
}
